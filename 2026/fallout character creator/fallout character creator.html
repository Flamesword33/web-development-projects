<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fallout character creator</title>
    <script type="text/javascript" src="../fallout character creator/assets/fallout character creator.js"></script>
    <link rel="stylesheet" href="../fallout character creator/assets/fallout character creator.css"/>
</head>

<body>
  <header align="center">
    <h1>S.P.E.C.I.A.L.</h1>
    <p>Remaining points to spend: <span id="points-left">5</span></p>
  </header>
  <main>
    <div class="left-panel">
      <table>
        <tr>
          <td onclick = "change_image('ST')">Strength</td>
          <td><button onclick="minus_sign('ST')">-</button></td>
          <td id="ST">5</td>
          <td><button onclick="plus_sign('ST')">+</button></td>
        </tr>
        <tr>
          <td onclick = "change_image('PE')">Perception</td>
          <td><button onclick="minus_sign('PE')">-</button></td>
          <td id="PE">5</td>
          <td><button onclick="plus_sign('PE')">+</button></td>
        </tr>
        <tr>
          <td onclick = "change_image('EN')">Endurance</td>
          <td><button onclick="minus_sign('EN')">-</button></td>
          <td id="EN">5</td>
          <td><button onclick="plus_sign('EN')">+</button></td>
        </tr>
        <tr>
          <td onclick = "change_image('CH')">Charisma</td>
          <td><button onclick="minus_sign('CH')">-</button></td>
          <td id="CH">5</td>
          <td><button onclick="plus_sign('CH')">+</button></td>
        </tr>
        <tr>
          <td onclick = "change_image('IN')">Intelligence</td>
          <td><button onclick="minus_sign('IN')">-</button></td>
          <td id="IN">5</td>
          <td><button onclick="plus_sign('IN')">+</button></td>
        </tr>
        <tr>
          <td onclick = "change_image('AG')">Agility</td>
          <td><button onclick="minus_sign('AG')">-</button></td>
          <td id="AG">5</td>
          <td><button onclick="plus_sign('AG')">+</button></td>
        </tr>
        <tr>
          <td onclick = "change_image('LK')">Luck</td>
          <td><button onclick="minus_sign('LK')">-</button></td>
          <td id="LK">5</td>
          <td><button onclick="plus_sign('LK')">+</button></td>
        </tr>
      </table>
    </div>
    <div class="right-panel">
      <img src="../fallout character creator/assets/pipboy thumbs up.jpg" class="center-image">
      <!--//for whatever reason the picutes are not loading. brute force attempt style="display: none;
      <img src="../fallout character creator/assets/ST.png" class="center-image">
      <img src="../fallout character creator/assets/PE.png" class="center-image">
      <img src="../fallout character creator/assets/IN.png" class="center-image">-->
      <p>Welcome to the Fallout character creator. </p>
    </div>
  </main>
  <footer>
    <p><span class="left">HP <span class="hp">30</span>/<span class="hp">30</span></span>   
      <span class="middle">AP <span class="ap">7</span>/<span class="ap">7</span></span>
      <button type="button" class="right" 
      onclick=next_page()>
      <!--"location.href='../fallout character creator/assets/stats screen.html'"-->
        Next</button>
    </p>
  </footer>
</body>
